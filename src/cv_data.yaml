projects:
  - title: "llm-judge-stats"
    url: "https://github.com/gondiam/llm-judge-stats"
    tagline:
      en: "Open-source Python package"
      es: "Paquete Python open source"
    highlights:
      en:
        - "Statistics to check whether an LLM judge can be trusted: Cohen's/Fleiss' kappa, ICC and F1/MCC with (stratified) bootstrap CIs, sample-size planning for labeling, and position-bias shuffling with majority voting. Tests validated against published values."
        - "Applied to the public MT-Bench human judgments: GPT-4 vs. human-majority kappa = 0.41 (95% CI 0.37-0.45) vs. human-human kappa of 0.50, with 15.8% position-inconsistent verdicts."
      es:
        - "Estadística para comprobar si un juez LLM es fiable: kappa de Cohen/Fleiss, ICC y F1/MCC con IC bootstrap (estratificado), cálculo del tamaño muestral para etiquetar, y barajado contra el sesgo de posición con voto mayoritario. Tests validados contra valores publicados."
        - "Aplicado a los juicios humanos públicos de MT-Bench: kappa GPT-4 vs. mayoría humana = 0,41 (IC95% 0,37-0,45) frente a un kappa humano-humano de 0,50, con un 15,8% de veredictos inconsistentes por posición."

