profile:
  en: "Data Scientist with 6 years of end-to-end experience across the full ML lifecycle — from statistical modeling and causal inference to LLM-based architectures, RAG pipelines, and MLOps. Background spans pharma, healthtech, and mobility, with production deployments on AWS and GCP. Currently designing an LLM-as-a-Judge system that audits narrative–quantitative consistency in multi-criteria decision analyses, with position-bias mitigation and 5-replica majority voting. Also built multi-hospital data lakes, FastAPI inference services, and clinical programming for EMA submissions."
  es: "Data Scientist con 6 años de experiencia end-to-end en el ciclo de vida del ML: modelado estadístico, inferencia causal, LLMs, RAG y MLOps. Trayectoria en pharma, healthtech y movilidad, con despliegues en producción sobre AWS y GCP. Actualmente diseño un sistema LLM-as-a-Judge que audita la consistencia narrativo-cuantitativa en análisis de decisión multicriterio, con mitigación del sesgo de posición y voto mayoritario de 5 réplicas. También he construido data lakes multihospital, servicios de inferencia con FastAPI y programación clínica para submissions ante la EMA."
experience:
  - id: "aiengineer_beway"
    title:
      en: "AI/ML Research Engineer"
      es: "Ingeniero de Investigación en IA/ML"
    company:
      en: "BeWay"
      es: "BeWay"
    period: "Jan 2026 - Present"
    highlights:
      en:
        - "**LLM-as-a-Judge for decision audits:** designed a judge that audits narrative–quantitative consistency in multi-criteria decision analyses (BOCR/AHP); mitigated position bias with per-replica shuffling and 5-replica majority voting, reaching 91.7% unanimous verdicts across 1,272 comparisons and surfacing contradictions (19%) for targeted human review instead of exhaustive manual checks."
        - "Benchmarked 36 runs: 2 models (GPT-4o, GPT-5.2) x 3 temperatures, 5 prompts iterated with human review."
        - "**RAG evidence builder (PoC, lead developer):** built an end-to-end pipeline with human-in-the-loop source curation: multi-format ingestion, LLM-as-a-Judge source scoring (multi-run averaging, coefficient-of-variation stability checks), hybrid retrieval (ChromaDB + BM25 with Reciprocal Rank Fusion), multi-agent synthesis with mandatory chunk-level citations, on Gemini API with a local Phi-3 fallback."
        - "Pre-registered the evaluation protocol (confirmatory vs. exploratory hypotheses, power analysis, bootstrap CIs, Benjamini-Hochberg): LLM–expert source selection met the criterion (F1 = 0.762 vs. 0.70 threshold) after I caught a caching bug that produced a spurious F1 = 0.45."
        - "Reported failed hypotheses without post-hoc threshold changes: LLM–human quality scores correlated weakly (Spearman rho = 0.19, 95% CI -0.09 to 0.45); chunk-level citations cut the audited hallucination rate from 57.5% to 14.0%, still above the pre-registered 5%."
        - "Shipped a React/TypeScript + FastAPI web app with live SSE progress for non-technical analysts, Dockerized, with pytest and CI (mypy, flake8)."
        - "*Tech stack:* Python, R, OpenAI API, Gemini API, Hugging Face transformers, ChromaDB, FastAPI, React, TypeScript, AWS (S3, SageMaker, Lambda, ECR), Docker, GitHub Actions."
      es:
        - "**LLM-as-a-Judge para auditoría de decisiones:** diseñé un juez que audita la consistencia narrativo-cuantitativa en análisis de decisión multicriterio (BOCR/AHP); mitigué el sesgo de posición barajando por réplica y con voto mayoritario de 5 réplicas, logrando un 91,7% de veredictos unánimes en 1.272 comparaciones y señalando las contradicciones (19%) para revisión humana dirigida."
        - "Comparé 36 ejecuciones: 2 modelos (GPT-4o, GPT-5.2) x 3 temperaturas, 5 prompts iterados con revisión humana."
        - "**RAG evidence builder (PoC, desarrollador principal):** pipeline end-to-end con curación humana de fuentes: ingesta multiformato, puntuación de fuentes con LLM-as-a-Judge (promedio multi-ejecución, estabilidad por coeficiente de variación), recuperación híbrida (ChromaDB + BM25 con Reciprocal Rank Fusion), síntesis multiagente con citas obligatorias a nivel de chunk, sobre Gemini API con Phi-3 local de respaldo."
        - "Preregistré el protocolo de evaluación (hipótesis confirmatorias vs. exploratorias, análisis de potencia, IC bootstrap, Benjamini-Hochberg): la selección de fuentes LLM–experto cumplió el criterio (F1 = 0,762 vs. umbral 0,70) tras detectar un bug de caché que producía un F1 falso de 0,45."
        - "Reporté las hipótesis no cumplidas sin modificar umbrales a posteriori: la correlación LLM–humano en calidad fue débil (Spearman rho = 0,19, IC95% -0,09 a 0,45); las citas a nivel de chunk bajaron la tasa de alucinación auditada del 57,5% al 14,0%, aún por encima del 5% preregistrado."
        - "Web app React/TypeScript + FastAPI (SSE) para analistas no técnicos, dockerizada, con pytest y CI."
        - "*Tech stack:* Python, R, OpenAI API, Gemini API, Hugging Face transformers, ChromaDB, FastAPI, React, TypeScript, AWS (S3, SageMaker, Lambda, ECR), Docker, GitHub Actions."
