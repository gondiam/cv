profile:
  en: "Data Scientist with 5+ years of end-to-end experience across the full ML lifecycle — from statistical modeling and causal inference to LLM-based architectures, RAG pipelines, and MLOps. Background spans pharma, healthtech, and mobility, with production deployments on AWS, GCP, and Azure. Currently designing and scaling an enterprise LLM-as-a-Judge evaluation system, including architecture design, bias-mitigation strategies, and automated BOCR audit pipelines. Proven ability to deliver in fast-moving environments: built data lakes integrating multi-hospital sources, shipped FastAPI-based ML inference services, and led clinical programming for EMA-submission studies. Equally comfortable owning a full pipeline solo or collaborating cross-functionally with research and engineering teams."
  es: "Data Scientist con más de 5 años de experiencia end-to-end en todo el ciclo de vida del ML — desde modelado estadístico e inferencia causal hasta arquitecturas basadas en LLMs, pipelines RAG y MLOps. Trayectoria en pharma, healthtech y movilidad, con despliegues en producción sobre AWS, GCP y Azure. Actualmente diseño y escalo un sistema empresarial LLM-as-a-Judge, incluyendo diseño de arquitectura, estrategias de mitigación de sesgos y pipelines automatizados de auditoría BOCR. Capacidad demostrada para entregar en entornos de alta velocidad: construcción de data lakes integrando fuentes hospitalarias múltiples, servicios de inferencia ML con FastAPI, y liderazgo de programación clínica para paquetes de submission ante la EMA. Cómodo tanto liderando un pipeline completo de forma autónoma como colaborando transversalmente con equipos de investigación e ingeniería."
